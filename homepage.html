<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechStore - Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
        }

        /* Navigation Bar */
        nav {
            background: #111827;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #38bdf8;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 17px;
        }

        nav ul li a:hover {
            color: #38bdf8;
        }

        /* Homepage */
        .home {
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .home-content h1 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .home-content h1 span {
            color: #38bdf8;
        }

        .home-content p {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .btn:hover {
            background: #0ea5e9;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            background: #111827;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>

        <div class="logo">
            TechStore
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="product.html">Products</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="log in.html">log out</a></li>
            
        </ul>

    </nav>

  
    <section class="home">

        <div class="home-content">

            <h1>
                Welcome to <span>TechStore</span>
            </h1>

            <p>
                Your online store for modern and reliable
                technology products.
            </p>

            <a href="products.html" class="btn">
                View Products
            </a>

        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>johnreevecalmorin@gmail.com</p>
    </footer>

</body>
</html>
