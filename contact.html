<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZone | Contact Us</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: white;
        }

        header {
            background: #111a2e;
            padding: 22px;
            text-align: center;
            border-bottom: 2px solid #00c8ff;
        }

        header h1 {
            color: #00c8ff;
            margin-bottom: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        nav a:hover {
            color: #00c8ff;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: #111a2e;
            border: 1px solid #24344f;
            border-radius: 12px;
            box-shadow: 0 0 15px #00c8ff22;
        }

        h2 {
            text-align: center;
            color: #00c8ff;
            margin-bottom: 12px;
        }

        .description {
            text-align: center;
            color: #b8c4d9;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #34445f;
            border-radius: 6px;
            background: #0b1120;
            color: white;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #00c8ff;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #00c8ff;
            color: #0b1120;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: white;
        }

        #message {
            text-align: center;
            color: #00c8ff;
            margin-top: 15px;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #aab7cc;
            margin-top: 20px;
        }

        @media (max-width: 500px) {
            .container {
                margin: 25px 15px;
                padding: 22px;
            }

            nav a {
                display: inline-block;
                margin: 6px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>TECHZONE</h1>

        <nav>
            <a href="homepage.html".html">Home</a>
            <a href="about.html">About</a>
            <a href="product.html">Products</a>
            <a href="contact.html">Contact</a>
            <a href="log in.html">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h2>Contact Us</h2>

        <p class="description">
            Have questions about our tech products?
            Send us a message!
        </p>

        <form id="contactForm">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="messageBox">Your Message</label>
            <textarea
                id="messageBox"
                placeholder="Write your message here..."
                required
            ></textarea>

            <button type="submit">Send Message</button>

            <p id="message"></p>

        </form>
    </div>

    <footer>
        <p>© 2026 TechZone | All Rights Reserved</p>
    </footer>

    <script>
        document.getElementById("contactForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("message").textContent =
                "Thank you! Your message has been recorded in this demo.";

            this.reset();
        });
    </script>

</body>
</html>
