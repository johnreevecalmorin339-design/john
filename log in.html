<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZone | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 35px;
            background: #111a2e;
            border: 1px solid #24344f;
            border-radius: 12px;
            box-shadow: 0 0 20px #00c8ff22;
        }

        h1 {
            text-align: center;
            color: #00c8ff;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #b8c4d9;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #0b1120;
            border: 1px solid #34445f;
            border-radius: 6px;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #00c8ff;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #00c8ff;
            color: #0b1120;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: white;
        }

        #error {
            color: #ff7070;
            text-align: center;
            margin-top: 15px;
        }

        .back-home {
            display: block;
            text-align: center;
            color: #00c8ff;
            text-decoration: none;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h1>TECHZONE</h1>
        <p class="subtitle">Login to Your Account</p>

        <form id="loginForm">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Log In</button>

            <p id="error"></p>
        </form>

        <a href="homepage.html" class="back-home">
            Back to Home
        </a>
    </div>

    <script>
        document.getElementById("loginForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            if (username === "John" && password === "12345") {
                window.location.href = "index.html";
            } else {
                document.getElementById("error").textContent =
                    "Incorrect username or password.";
            }
        });
    </script>

</body>
</html>
